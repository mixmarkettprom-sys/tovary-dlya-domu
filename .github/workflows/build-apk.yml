name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p package project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d package
          SOURCE=$(find package -type f -name "tovary_dlya_domu_source.zip" | head -n 1)
          if [ -z "$SOURCE" ]; then
            SOURCE=$(find package -type f -name "*.zip" | head -n 1)
          fi
          echo "Found source: $SOURCE"
          unzip -q "$SOURCE" -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tovary-dlya-domu-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
